<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a4a2e"/>
      <stop offset="100%" stop-color="#0f2b1c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0dfa0"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="96" fill="none" stroke="#c9a84c" stroke-width="6" opacity="0.55"/>

  <!-- crescent accent -->
  <circle cx="366" cy="128" r="40" fill="#f0dfa0"/>
  <circle cx="382" cy="116" r="34" fill="#0f2b1c"/>

  <!-- calendar body -->
  <rect x="108" y="164" width="296" height="256" rx="26" fill="#163825" stroke="url(#gold)" stroke-width="8"/>
  <rect x="108" y="164" width="296" height="70" rx="26" fill="url(#gold)"/>
  <rect x="108" y="204" width="296" height="30" fill="url(#gold)"/>

  <!-- calendar rings -->
  <rect x="168" y="140" width="18" height="56" rx="9" fill="#c9a84c"/>
  <rect x="326" y="140" width="18" height="56" rx="9" fill="#c9a84c"/>

  <!-- schedule dots grid -->
  <g fill="#f0dfa0">
    <circle cx="160" cy="278" r="13"/>
    <circle cx="216" cy="278" r="13"/>
    <circle cx="272" cy="278" r="13"/>
    <circle cx="328" cy="278" r="13"/>

    <circle cx="160" cy="330" r="13" fill="#7e5bb5"/>
    <circle cx="216" cy="330" r="13"/>
    <circle cx="272" cy="330" r="13" fill="#3a7bd5"/>
    <circle cx="328" cy="330" r="13"/>

    <circle cx="160" cy="382" r="13"/>
    <circle cx="216" cy="382" r="13" fill="#d94f3d"/>
    <circle cx="272" cy="382" r="13"/>
    <circle cx="328" cy="382" r="13" fill="#e67e22"/>
  </g>
</svg>
